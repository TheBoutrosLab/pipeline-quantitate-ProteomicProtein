output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
project_name:
  type: String
  required: true
  help: Project name for outputs.
input_consensusXML:
  type: Path
  mode: r
  required: true
  help: One cohort-level consensusXML file for protein quantification.
unfiltered_idXML:
  type: Path
  mode: r
  required: false
  help: CSV of unfiltered PEP-scored idXML files for ProteinProphet.
decoy_database:
  type: Path
  mode: r
  required: false
  help: Target-decoy FASTA used for the idXML searches.
decoy_string:
  type: String
  required: false
  help: Prefix identifying decoy protein accessions.
protein_grouping_algorithm:
  type: String
  required: false
  help: ProteinProphet or ProteinInferencer.
filter_protein_fdr:
  type: Bool
  required: false
  help: Filter features by protein level FDR when inference calculates it.
protein_fdr_cutoff:
  type: Number
  required: false
  help: Required protein q-value cutoff when filter_protein_fdr is true; must be at least 0 and below 1.
protein_inference_protein_fdr:
  type: Bool
  required: false
  help: Calculate protein level FDR in ProteinInference.
protein_quantifier_best_charge:
  type: Bool
  required: false
  help: Select one charge globally per modified peptide when quantifying proteins.
protein_quantifier_fractions_aggregate:
  type: String
  required: false
  help: Combine fractions within each assay using sum or best; defaults to sum.
save_intermediate_files:
  type: Bool
  required: false
  help: Publish intermediate files.
resource_allocation_profile_tag:
  type: String
  required: false
  help: Resource profile in resources.json.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource adjustments.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory adjustments.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU adjustments.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
